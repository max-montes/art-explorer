name: Generate Met catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of accepted paintings and sculptures
        required: true
        default: "100"
        type: string
      candidate_cap:
        description: Maximum Met object IDs to inspect
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate manifest
        run: |
          npm run catalog:met -- \
            --limit "${{ inputs.limit }}" \
            --candidate-cap "${{ inputs.candidate_cap }}" \
            --output curation/met-open-access-${{ inputs.limit }}.json

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: met-open-access-${{ inputs.limit }}
          path: curation/met-open-access-${{ inputs.limit }}.json
          if-no-files-found: error
